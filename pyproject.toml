[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cc2olx"
dynamic = ["version"]
description = "Command line tool, that converts Common Cartridge courses to Open edX Studio imports."
readme = "README.rst"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["cc2olx"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "Django>=5.2",
    "attrs",
    "lxml",
    "requests",
    "youtube-dl",
]

[project.scripts]
cc2olx = "cc2olx.main:main"

[project.urls]
Homepage = "https://github.com/openedx/cc2olx"
Source = "https://github.com/openedx/cc2olx"
Issues = "https://github.com/openedx/cc2olx/issues"

[dependency-groups]
test-base = [
    "coverage",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-mock",
    "xmlformatter",
]
test = [{include-group = "test-base"}, "Django>=5.2,<6.0"]
quality = [{include-group = "test"}, "black", "flake8"]
ci = ["tox", "tox-uv>=1"]
dev = [{include-group = "quality"}, {include-group = "ci"}, "build", "twine"]

[tool.edx_lint]
uv_constraints = []

[tool.uv]
package = true
default-groups = []

#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["cc2olx*"]
exclude = ["*tests*"]

[tool.setuptools.package-data]
"cc2olx" = [
    "templates/**",
]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "*.tests*"]

[tool.coverage.run]
branch = true
source_pkgs = ["cc2olx"]
omit = ["test_settings.py", "*migrations*", "*admin.py", "*static*", "*templates*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "logger\\.[a-zA-Z]+\\(.*\\)",
]

[tool.semantic_release]
# Explicitly set the tag format (same as default).
tag_format = "v{version}"
# We use SETUPTOOLS_SCM_PRETEND_VERSION to pull the version from python-semantic-release instead
# of actually pulling it from version control because the build step happens before the repo gets
# tagged.
build_command = "python -m pip install --upgrade build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.master]
match = "master"

# Release branches (e.g. release/ulmo) can be released by running release.yml
# manually to patch an older release line. The version comes from that branch's tags.
[tool.semantic_release.branches.maintenance]
match = "^release/[a-z]+$"
