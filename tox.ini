[tox]
requires = tox-uv>=1
envlist = django52, quality, formatting

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands = flake8 --max-line-length=120 src tests

[testenv:formatting]
runner = uv-venv-lock-runner
dependency_groups = quality
commands = black --check --diff --line-length 120 src tests

[testenv]
runner = uv-venv-lock-runner
setenv =
	PYTHONPATH = {toxinidir}
dependency_groups =
    django52: test
commands =
	pytest --basetemp={envtmpdir} --cov cc2olx --cov-report term-missing --cov-report xml

[flake8]
exclude = .tox,.eggs
